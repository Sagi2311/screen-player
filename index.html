<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Cinema & Media Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player, #videoPlayer, #embedPlayer { 
            width: 100vw; 
            height: 100vh; 
            border: none; 
            object-fit: cover; 
            display: none; 
        }
    </style>
    <!-- HLS.js პირდაპირი .m3u8 ნაკადებისთვის -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <!-- 1. YouTube ფლეიერის კონტეინერი -->
    <div id="player"></div>

    <!-- 2. პირდაპირი ვიდეოს კონტეინერი (.m3u8 / .mp4) -->
    <video id="videoPlayer" playsinline autoplay></video>

    <!-- 3. გარე საიტების Embed ფლეიერი (თითოეული მოთამაშე იღებს თავის ტოკენს) -->
    <iframe id="embedPlayer" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let streamUrl = urlParams.get('url') || urlParams.get('embed');
        let videoId = urlParams.get('v');

        // ავტომატური ამოცნობა: თუ 'v'-ში სრული ბმული გადმოეცა
        if (!streamUrl && videoId && (videoId.startsWith('http://') || videoId.startsWith('https://'))) {
            streamUrl = videoId;
            videoId = null;
        }

        // ტიპის განსაზღვრა
        function isYouTubeLink(url) {
            if (!url) return false;
            return url.includes('youtube.com') || url.includes('youtu.be') || url.includes('shorts/');
        }

        function isDirectFile(url) {
            if (!url) return false;
            return url.includes('.m3u8') || url.includes('.mp4') || url.includes('.webm');
        }

        let isYT = !!videoId || isYouTubeLink(streamUrl);
        let isDirect = !isYT && isDirectFile(streamUrl);
        let isEmbed = !isYT && !isDirect && !!streamUrl;

        let player;
        let hasReported = false;

        function notifyFiveM() {
            if (!hasReported) {
                hasReported = true;
                fetch('https://qbx_screens/videoPlaybackStarted', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'started' })
                }).catch(() => {});
            }
        }

        // ==========================================
        // 1. გარე საიტის EMBED ფლეიერი (ფილმები)
        // ==========================================
        if (isEmbed) {
            const embedFrame = document.getElementById('embedPlayer');
            embedFrame.style.display = 'block';
            embedFrame.src = streamUrl;
            notifyFiveM();
        }
        // ==========================================
        // 2. პირდაპირი ნაკადი (.m3u8 HLS / MP4)
        // ==========================================
        else if (isDirect) {
            const video = document.getElementById('videoPlayer');
            video.style.display = 'block';
            video.volume = 1.0;
            video.muted = false;

            if (streamUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => {
                            video.muted = true;
                            video.play();
                        });
                        notifyFiveM();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                    video.play();
                    notifyFiveM();
                }
            } else {
                video.src = streamUrl;
                video.play().catch(() => {
                    video.muted = true;
                    video.play();
                });
                notifyFiveM();
            }

            video.addEventListener('playing', () => notifyFiveM());
        }
        // ==========================================
        // 3. YOUTUBE ფლეიერი (Ad-Buster + Freeze Sync)
        // ==========================================
        else {
            const ytDiv = document.getElementById('player');
            ytDiv.style.display = 'block';

            if (!videoId && streamUrl) {
                const match = streamUrl.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
                videoId = match ? match[1] : streamUrl;
            }
            videoId = videoId || 'hyF9INcLSZs';

            window.onYouTubeIframeAPIReady = function() {
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: {
                        autoplay: 1,
                        mute: 1,
                        controls: 0,
                        showinfo: 0,
                        rel: 0,
                        modestbranding: 1,
                        playsinline: 1,
                        iv_load_policy: 3,
                        disablekb: 1,
                        fs: 0
                    },
                    events: {
                        'onReady': (e) => {
                            e.target.mute();
                            e.target.setVolume(0);
                            e.target.playVideo();
                            startAggressiveAutoSkip();
                        },
                        'onStateChange': onPlayerStateChange
                    }
                });
            };

            function onPlayerStateChange(event) {
                if (event.data === YT.PlayerState.PLAYING) {
                    if (player && player.mute) {
                        player.mute();
                        player.setVolume(0);
                    }

                    const activeId = player.getVideoData ? player.getVideoData().video_id : '';
                    if (!hasReported && (!activeId || activeId === videoId)) {
                        hasReported = true;
                        player.pauseVideo();
                        notifyFiveM();
                        setTimeout(() => {
                            if (player && player.playVideo) {
                                player.playVideo();
                            }
                        }, 1200);
                    }
                }
            }

            // ⚡ Skip Ad ავტო-დაჭერის ძრავი
            function startAggressiveAutoSkip() {
                const skipSelectors = [
                    '.ytp-ad-skip-button',
                    '.ytp-ad-skip-button-modern',
                    '.ytp-skip-ad-button',
                    '.ytp-ad-skip-button-slot',
                    'button.ytp-ad-skip-button-modern',
                    '.videoAdUiSkipButton',
                    '.ytp-ad-preview-container',
                    'button[class*="skip"]',
                    'div[class*="skip-button"]'
                ];

                setInterval(() => {
                    const targets = [document];
                    const iframes = document.querySelectorAll('iframe');
                    iframes.forEach(frame => {
                        try {
                            const frameDoc = frame.contentDocument || frame.contentWindow.document;
                            if (frameDoc) targets.push(frameDoc);
                        } catch (e) {}
                    });

                    for (const doc of targets) {
                        try {
                            const vids = doc.querySelectorAll('video');
                            vids.forEach(v => {
                                v.muted = true;
                                v.volume = 0;
                                if (v.closest && v.closest('.ad-showing, .ad-interrupting')) {
                                    if (v.duration && !isNaN(v.duration)) {
                                        v.currentTime = v.duration;
                                    }
                                }
                            });
                        } catch (e) {}

                        for (const sel of skipSelectors) {
                            try {
                                const btn = doc.querySelector(sel);
                                if (btn && typeof btn.click === 'function') {
                                    btn.click();
                                    break;
                                }
                            } catch (e) {}
                        }
                    }
                }, 100);
            }

            // 🔇 YouTube აუდიოს იძულებითი ჩახშობა
            setInterval(() => {
                try {
                    const media = document.querySelectorAll('video, audio');
                    media.forEach(m => {
                        m.muted = true;
                        m.volume = 0;
                    });
                } catch (e) {}
            }, 200);
        }
    </script>
</body>
</html>
