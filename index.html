<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Screen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100vw; height: 100vh; border: none; pointer-events: none; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v') || 'hyF9INcLSZs';

        let player;
        let hasReported = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    mute: 1, // 🔇 ეკრანი დადამუნჯებულია (ხმა მოდის მხოლოდ xsound-იდან)
                    controls: 0,
                    showinfo: 0,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    iv_load_policy: 3,
                    disablekb: 1,
                    fs: 0
                },
                events: {
                    'onReady': (e) => {
                        e.target.mute();
                        e.target.setVolume(0);
                        e.target.playVideo();
                        startAggressiveAutoSkip();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (player && player.mute) {
                    player.mute();
                    player.setVolume(0);
                }

                const activeId = player.getVideoData ? player.getVideoData().video_id : '';
                if (!hasReported && (!activeId || activeId === videoId)) {
                    hasReported = true;

                    // ⏸️ 1. მომენტალურად ვაპაუზებთ ვიდეოს 0:00-ზე
                    player.pauseVideo();

                    // 📡 2. FiveM-ს ვაძლევთ ბრძანებას, რომ xsound-მა დაიწყოს ჩატვირთვა
                    fetch('https://qbx_screens/videoPlaybackStarted', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'started' })
                    }).catch(() => {});

                    // ▶️ 3. ზუსტად 1200ms-ში (სანამ xsound აუდიოს გაუშვებს), ვრთავთ ვიდეოს
                    setTimeout(() => {
                        if (player && player.playVideo) {
                            player.playVideo();
                        }
                    }, 1200);
                }
            }
        }

        // ⚡ Skip Ad ავტო-დაჭერის ძრავი
        function startAggressiveAutoSkip() {
            const skipSelectors = [
                '.ytp-ad-skip-button',
                '.ytp-ad-skip-button-modern',
                '.ytp-skip-ad-button',
                '.ytp-ad-skip-button-slot',
                'button.ytp-ad-skip-button-modern',
                '.videoAdUiSkipButton',
                '.ytp-ad-preview-container',
                'button[class*="skip"]',
                'div[class*="skip-button"]'
            ];

            setInterval(() => {
                const targets = [document];
                const iframes = document.querySelectorAll('iframe');
                iframes.forEach(frame => {
                    try {
                        const frameDoc = frame.contentDocument || frame.contentWindow.document;
                        if (frameDoc) targets.push(frameDoc);
                    } catch (e) {}
                });

                for (const doc of targets) {
                    try {
                        const vids = doc.querySelectorAll('video');
                        vids.forEach(v => {
                            v.muted = true;
                            v.volume = 0;
                            if (v.closest && v.closest('.ad-showing, .ad-interrupting')) {
                                if (v.duration && !isNaN(v.duration)) {
                                    v.currentTime = v.duration;
                                }
                            }
                        });
                    } catch (e) {}

                    for (const sel of skipSelectors) {
                        try {
                            const btn = doc.querySelector(sel);
                            if (btn && typeof btn.click === 'function') {
                                btn.click();
                                break;
                            }
                        } catch (e) {}
                    }
                }
            }, 100);
        }

        // 🔇 საიტის აუდიოს იძულებითი ჩახშობა
        setInterval(() => {
            try {
                const media = document.querySelectorAll('video, audio');
                media.forEach(m => {
                    m.muted = true;
                    m.volume = 0;
                });
            } catch (e) {}
        }, 200);
    </script>
</body>
</html>
