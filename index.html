<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Screen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100vw; height: 100vh; border: none; pointer-events: none; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v') || 'hyF9INcLSZs';

        let player;
        let hasReported = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    mute: 1, // 🔇 სრულად თიშავს ეკრანის საკუთარ ხმას (აღარ იქნება 2 ხმა!)
                    controls: 0,
                    showinfo: 0,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    iv_load_policy: 3,
                    disablekb: 1,
                    fs: 0
                },
                events: {
                    'onReady': (e) => {
                        e.target.mute();
                        e.target.playVideo();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // როდესაც ნამდვილი ვიდეო იწყება (რეკლამის დასრულებისთანავე)
            if (event.data === YT.PlayerState.PLAYING) {
                if (!hasReported) {
                    hasReported = true;
                    // ატყობინებს FiveM-ს, რომ ჩართოს xsound-ის ხმა ზუსტად ახლა!
                    fetch('https://qbx_screens/videoPlaybackStarted', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'started' })
                    }).catch(() => {});
                }
            }
        }
    </script>
</body>
</html>
